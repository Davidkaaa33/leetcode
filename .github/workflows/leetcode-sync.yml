name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git identity
        run: |
          git config user.name "Davidkaaa33"
          git config user.email "233500698+Davidkaaa33@users.noreply.github.com"

      - name: Install LeetCode sync CLI
        run: pip install leetcode-sync-cli==0.1.1

      - name: Prepare LeetCode sync cache
        run: mkdir -p "$HOME/.leetcode_sync"

      - name: Sync accepted LeetCode submissions
        id: leetcode_sync
        continue-on-error: true
        timeout-minutes: 10
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          CSRFTOKEN: ${{ secrets.CSRFTOKEN }}
        run: |
          if [[ -z "$LEETCODE_SESSION" || -z "$CSRFTOKEN" ]]; then
            echo "::warning title=LeetCode authentication::LEETCODE_SESSION or CSRFTOKEN is missing."
            exit 1
          fi
          # The CLI prompts for a cookie on authentication failure. CI must never hang.
          leetcode-sync --sync < /dev/null

      - name: Explain failed LeetCode sync
        if: steps.leetcode_sync.outcome == 'failure'
        run: |
          echo "::warning title=LeetCode sync did not complete::Check or renew LEETCODE_SESSION and CSRFTOKEN in repository Actions secrets."
          echo "### LeetCode sync needs attention" >> "$GITHUB_STEP_SUMMARY"
          echo "The synchronization CLI failed (latest known cause: expired session cookies)." >> "$GITHUB_STEP_SUMMARY"
          echo "Update **LEETCODE_SESSION** and **CSRFTOKEN** under Settings → Secrets and variables → Actions." >> "$GITHUB_STEP_SUMMARY"
          echo "The existing solutions and generated README are kept; no new submissions are claimed." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate portfolio README and coverage
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          CSRFTOKEN: ${{ secrets.CSRFTOKEN }}
        run: python scripts/generate_readme.py

      - name: Commit and push changes
        run: |
          git add problems README.md coverage.svg
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Auto sync LeetCode submissions"
          git push
