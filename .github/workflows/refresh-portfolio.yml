name: Refresh LeetCode portfolio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "problems/**"
      - "scripts/generate_readme.py"

permissions:
  contents: write

concurrency:
  group: leetcode-portfolio-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install README generator dependencies
        run: python -m pip install "requests>=2.31,<3"

      - name: Generate README and coverage
        run: python scripts/generate_readme.py

      - name: Validate newest-first sorting and linked solutions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md").read_text(encoding="utf-8")
          rows = [
              line for line in readme.split("## Problems", 1)[1].splitlines()
              if line.startswith("| [")
          ]
          if not rows:
              raise SystemExit("README contains no problem rows")

          dates = []
          for row in rows:
              stamp = re.search(r"\|\s*(\d{4}-\d{2}-\d{2})\s*\|", row)
              solution = re.search(r"\[solution\]\((problems/[^)]+)\)", row)
              if not stamp or not solution or not Path(solution.group(1)).is_dir():
                  raise SystemExit("Invalid README problem row: " + row)
              dates.append(stamp.group(1))
          if dates != sorted(dates, reverse=True):
              raise SystemExit("README solution rows are not sorted by recency")
          print(f"Validated {len(rows)} solutions: newest first.")
          PY

      - name: Commit generated portfolio only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md coverage.svg problems
          if git diff --cached --quiet; then
            echo "Generated portfolio is up-to-date."
            exit 0
          fi
          git commit -m "Refresh LeetCode README after browser sync"
          git push
